# Quake-style drop-down terminal (kitten quick-access-terminal).
# Summoned/hidden by re-running the kitten; bound to $mod+grave in sway.

edge top
lines 25
background_opacity 0.95

# Keep the window up when focus moves elsewhere; set to yes for
# auto-hide-on-click-away behaviour.
hide_on_focus_loss no

# Take keyboard focus when shown
focus_policy exclusive
